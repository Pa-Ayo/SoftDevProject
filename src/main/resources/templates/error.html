<!--/*
  File:        error.html
  Module:      Error handling
  Purpose:     Friendly page for errors; never shows technical details.
  Responsible: Ythan Joshua Costelo
*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Something went wrong')}"></head>
<body>
  <a th:replace="~{fragments :: back}"></a>
  <main class="centered">
    <div class="panel panel-small" th:switch="${status}">
      <h1>Something went wrong</h1>
      <p th:case="403">This form has expired. Please go back, reload the page and try again.</p>
      <p th:case="404">We could not find that page.</p>
      <p th:case="503">The service is unavailable right now. Please try again in a moment.</p>
      <p th:case="*">Please try again in a moment.</p>
    </div>
  </main>
</body>
</html>
