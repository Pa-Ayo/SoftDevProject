# File:        application.properties
# Module:      Configuration
# Purpose:     All application settings. Secrets come from environment variables or the git-ignored .env file.
# Responsible: Felix Joshua H. Abing

spring.application.name=pa-ayo
spring.config.import=optional:file:.env[.properties]

# Web server (Render injects PORT and terminates HTTPS in front of the app)
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
spring.web.locale=en_US
spring.web.locale-resolver=fixed

# Public address used in password reset links (Render sets RENDER_EXTERNAL_URL)
pa-ayo.base-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}

# Firestore
pa-ayo.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
pa-ayo.firebase.project-id=${FIREBASE_PROJECT_ID:demo-pa-ayo}
pa-ayo.firebase.emulator-host=${FIRESTORE_EMULATOR_HOST:}

# First administrator
pa-ayo.admin.username=${ADMIN_USERNAME:}
pa-ayo.admin.email=${ADMIN_EMAIL:}
pa-ayo.admin.password=${ADMIN_PASSWORD:}

# Report photos
pa-ayo.cloudinary.url=${CLOUDINARY_URL:}
pa-ayo.upload.max-file-size=5MB
pa-ayo.upload.allowed-types=image/jpeg,image/png,image/webp
spring.servlet.multipart.max-file-size=${pa-ayo.upload.max-file-size}
spring.servlet.multipart.max-request-size=6MB
# Lazy parsing lets ReportController show an inline error for oversized photos;
# the larger swallow size keeps Tomcat from cutting the connection first.
spring.servlet.multipart.resolve-lazily=true
server.tomcat.max-swallow-size=20MB

# Password reset email (Render's free tier blocks ports 25, 465 and 587)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
pa-ayo.mail.from=${MAIL_FROM:}

# News bot
# Official Province of Cebu listings; robots.txt of cebu.gov.ph allows bots (checked 24 Nov 2026).
# dpwh.gov.ph and Mandaue's portal cannot be used: see docs/NEWS_SOURCES.md.
pa-ayo.news.source-urls=https://www.cebu.gov.ph/?s=DPWH,https://www.cebu.gov.ph/?s=road,https://www.cebu.gov.ph/?s=flood
pa-ayo.news.keywords=road,highway,bridge,drainage,flood,flooding,landslide,garbage,waste,sanitation,streetlight,electricity,power interruption,infrastructure,public works,DPWH
pa-ayo.news.user-agent=PaAyoNewsBot/1.0 (student project; reads public advisories once a day)
pa-ayo.news.timeout-ms=10000
pa-ayo.news.max-summary-length=300
pa-ayo.news.cron=0 0 6 * * *
