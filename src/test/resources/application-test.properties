# File:        application-test.properties
# Module:      Testing
# Purpose:     Settings for tests (profile "test"). Loaded on top of application.properties.
# Responsible: Reuel Matthew Arcilla (QA)

# Separate Firestore project id: the emulator keeps it apart from your local dev data (demo-pa-ayo),
# so tests can wipe their own data without touching your seed data.
pa-ayo.firebase.project-id=demo-pa-ayo-test
pa-ayo.firebase.emulator-host=127.0.0.1:8085
pa-ayo.firebase.credentials-path=

# No real first admin, mail or photo storage in tests (mock them or use test values in the test itself).
pa-ayo.admin.username=
pa-ayo.admin.email=
pa-ayo.admin.password=
pa-ayo.cloudinary.url=
spring.mail.host=

# Never run the news bot by itself during tests ("-" disables a Spring cron trigger).
pa-ayo.news.cron=-
# Tests must not call the real government sites; scraper tests use fixtures/news/*.html.
pa-ayo.news.source-urls=
