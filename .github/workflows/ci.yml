# File:        ci.yml
# Module:      Testing
# Purpose:     Runs the tests on every pull request and push to main, and enforces the 80% coverage gate (FR-10).
# Responsible: Reuel Matthew Arcilla (QA)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # "mvn test" also runs the JaCoCo check: it fails below 80% line coverage on the four gated classes.
      - run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: target/site/jacoco

  integration:
    name: Integration + browser tests (Firestore emulator)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    env:
      # Makes a missing emulator or browser FAIL the tests instead of silently skipping them.
      REQUIRE_TEST_INFRA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: mvn -B exec:java -e -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: Run *IT tests against the Firestore emulator
        run: npx -y firebase-tools@15 emulators:exec --only firestore --project demo-pa-ayo "mvn -B verify -Pintegration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-all-and-reports
          path: |
            target/site/jacoco-all
            target/failsafe-reports
            target/surefire-reports
